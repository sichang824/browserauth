# Natural Person E-Tax withholding web app. The site WAF rejects Go's native
# HTTP/TLS fingerprint, so authentication is verified with an in-browser fetch.
id: etax
base_url: https://etax.chinatax.gov.cn
login_url: /
cookie:
  magic: "ETAXENC\x01"
  env: ETAX_COOKIE
chrome_path_env: ETAX_CHROME_PATH
no_fail_env: ETAX_NO_FAIL
browser:
  entry_text: 单位办税
auth:
  transport: browser
  method: GET
  path: /web/zh/loginstatus/check
  ok_status: 200
  username_json_paths:
    - code
  username_forbidden:
    - FAIL
    - FAILED
    - ERROR
    - UNAUTHORIZED
