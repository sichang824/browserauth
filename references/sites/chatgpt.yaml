id: chatgpt
base_url: https://chatgpt.com
login_url: /
cookie:
  magic: "CHATGPTENC\x01"
  env: CHATGPT_COOKIE
chrome_path_env: CHATGPT_CHROME_PATH
no_fail_env: CHATGPT_NO_FAIL
auth:
  method: GET
  path: /api/auth/session
  ok_status: 200
  username_json_paths:
    - user.email
    - user.name
    - email
    - name
