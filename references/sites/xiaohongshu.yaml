# 小红书 (Xiaohongshu / RED). Login UI is www.xiaohongshu.com; the main SNS
# APIs (edith.xiaohongshu.com/api/sns/web/...) require x-s/x-t JS signatures,
# so cookie-only HTTP cannot call them. Auth verify uses the creator platform
# galaxy API instead: no signature needed, accepts the www web_session cookie
# (shared .xiaohongshu.com SSO). Same split-host pattern as authz.
id: xiaohongshu
base_url: https://creator.xiaohongshu.com
login_url: https://www.xiaohongshu.com/explore?channel_id=homefeed.love_v3
cookie:
  magic: "XIAOHONGSHUENC\x01"
  env: XIAOHONGSHU_COOKIE
chrome_path_env: XIAOHONGSHU_CHROME_PATH
no_fail_env: XIAOHONGSHU_NO_FAIL
auth:
  method: GET
  path: /api/galaxy/user/info
  ok_status: 200
  username_json_paths:
    - data.userName
  identity_json_paths:
    - data.userId
  user_id_json_path: data.redId
